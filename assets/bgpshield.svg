<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t d">
  <title id="t">BGPShield</title>
  <desc id="d">BGPShield. 2.87% of routed networks publish an ASPA record. 5.41% of routes contain two adjacent publishers. Python 3.12, 386 tests passing, CI, dashboard rebuilt daily.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#111626"/><stop offset="1" stop-color="#0b0e18"/></linearGradient>
    <linearGradient id="glint" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="900" height="260" rx="14"/></clipPath>
  </defs>
  <style>
    .pop { animation: pop .9s ease-out both; }
    .rise { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.3s cubic-bezier(.2,.7,.2,1) both; }
    .beacon { transform-box: fill-box; transform-origin: center; animation: beacon 2.4s ease-out infinite; }
    .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes beacon { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }

    .comet { animation: comet 14s linear infinite; }
    .comet-tail { animation: comet-tail 14s linear infinite; }
    @keyframes comet { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -2296; } }
    @keyframes comet-tail { from { stroke-dashoffset: 70; } to { stroke-dashoffset: -2226; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .comet, .comet-tail { display: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="900" height="260" fill="url(#surface)"/>

    <g class="rise" style="animation-delay:.1s">
      <text x="40" y="52" class="sans" font-size="26" font-weight="800" fill="#f1f5ff">BGPShield</text>
      <text x="40" y="74" class="mono" font-size="9.5" letter-spacing="2.5" fill="#6b7590">RPKI ROV + ASPA ADOPTION · PASSIVE-ONLY MEASUREMENT</text>
    </g>
    <text x="852" y="47" text-anchor="end" class="mono" font-size="9" letter-spacing="2.5" fill="#6b7590">DASHBOARD REBUILT DAILY</text>
    <circle cx="866" cy="44" r="3.2" fill="#9cc2ff" class="beacon" style="animation-delay:0.0s"/>
    <circle cx="866" cy="44" r="3.2" fill="#9cc2ff"/>
    <path d="M40 92H860" stroke="#232b40"/>
    <path d="M450 110V210" stroke="#232b40"/>
    
    <g class="rise" style="animation-delay:0.40s">
      <text x="40" y="146" class="sans" font-size="48" font-weight="800" fill="#f1f5ff">2.87%</text>
      <text x="40" y="172" class="sans" font-size="14" fill="#b8c2d9">of routed networks publish an ASPA record</text>
    </g>
    <rect x="40" y="186" width="380" height="8" rx="4" fill="#1a2135"/>
    <clipPath id="t0"><rect x="40" y="186" width="380" height="8" rx="4.0"/></clipPath>
    <g clip-path="url(#t0)"><rect x="-50" y="186" width="90" height="8" fill="url(#glint)" opacity=".8">
      <animateTransform attributeName="transform" type="translate" values="0 0;470 0;470 0" keyTimes="0;0.267;1" dur="6s" begin="2.2s" repeatCount="indefinite"/>
    </rect></g>
    <rect x="40" y="186" width="10.9" height="8" rx="4" fill="#9cc2ff" class="grow" style="animation-delay:0.80s"/>
    <circle cx="46.9" cy="190" r="4" fill="#9cc2ff" class="beacon" style="animation-delay:1.4s"/>
    <g class="mono" font-size="9" fill="#6b7590"><text x="40" y="210">0</text><text x="420" y="210" text-anchor="end">100%</text></g>
    <g class="rise" style="animation-delay:0.70s">
      <text x="480" y="146" class="sans" font-size="48" font-weight="800" fill="#f1f5ff">5.41%</text>
      <text x="480" y="172" class="sans" font-size="14" fill="#b8c2d9">of routes contain two adjacent publishers</text>
    </g>
    <rect x="480" y="186" width="380" height="8" rx="4" fill="#1a2135"/>
    <clipPath id="t1"><rect x="480" y="186" width="380" height="8" rx="4.0"/></clipPath>
    <g clip-path="url(#t1)"><rect x="390" y="186" width="90" height="8" fill="url(#glint)" opacity=".8">
      <animateTransform attributeName="transform" type="translate" values="0 0;470 0;470 0" keyTimes="0;0.267;1" dur="6s" begin="2.45s" repeatCount="indefinite"/>
    </rect></g>
    <rect x="480" y="186" width="20.6" height="8" rx="4" fill="#9cc2ff" class="grow" style="animation-delay:1.10s"/>
    <circle cx="496.6" cy="190" r="4" fill="#9cc2ff" class="beacon" style="animation-delay:1.8s"/>
    <g class="mono" font-size="9" fill="#6b7590"><text x="480" y="210">0</text><text x="860" y="210" text-anchor="end">100%</text></g>
    <path d="M40 224H860" stroke="#232b40"/>
    <g class="mono" font-size="9" letter-spacing="1.8" fill="#6b7590">
      <text x="40" y="244">PYTHON 3.12 · 386 TESTS PASSING · CI · EVERY NUMBER RE-DERIVES WITH ONE COMMAND</text>
      <text x="860" y="244" text-anchor="end" fill="#9cc2ff">LIVE DASHBOARD ↗</text>
    </g>
    <rect x=".5" y=".5" width="899" height="259" rx="14" fill="none" stroke="#232b40"/>
    <path d="M14.5 0.5H885.5A14 14 0 0 1 899.5 14.5V245.5A14 14 0 0 1 885.5 259.5H14.5A14 14 0 0 1 0.5 245.5V14.5A14 14 0 0 1 14.5 0.5Z" fill="none" stroke="#9cc2ff" stroke-width="3" stroke-opacity=".2" stroke-dasharray="110 2186" class="comet-tail"/>
    <path d="M14.5 0.5H885.5A14 14 0 0 1 899.5 14.5V245.5A14 14 0 0 1 885.5 259.5H14.5A14 14 0 0 1 0.5 245.5V14.5A14 14 0 0 1 14.5 0.5Z" fill="none" stroke="#9cc2ff" stroke-width="1.5" stroke-dasharray="36 2260" stroke-linecap="round" class="comet"/>
  </g>
</svg>
