      <g clip-path="url(#nameClip)"><rect class="shine" x="-240" y="44" width="140" height="90" fill="url(#shineGrad)" transform="skewX(-20)"/></g>
    </g>

    <text x="261.0" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="18" fill="#b8c2d9" textLength="378.0" lengthAdjust="spacingAndGlyphs" clip-path="url(#typeClip)">Routing research. Shipped products.</text>
    <g class="blink"><rect x="641.0" y="140" width="9" height="20" fill="#9cc2ff" opacity=".85">
      <animate attributeName="x" values="262.0;272.8;283.6;294.4;305.2;316.0;326.8;337.6;348.4;359.2;370.0;380.8;391.6;402.4;413.2;424.0;434.8;445.6;456.4;467.2;478.0;488.8;499.6;510.4;521.2;532.0;542.8;553.6;564.4;575.2;586.0;596.8;607.6;618.4;629.2;640.0" keyTimes="0.0000;0.0286;0.0571;0.0857;0.1143;0.1429;0.1714;0.2000;0.2286;0.2571;0.2857;0.3143;0.3429;0.3714;0.4000;0.4286;0.4571;0.4857;0.5143;0.5429;0.5714;0.6000;0.6286;0.6571;0.6857;0.7143;0.7429;0.7714;0.8000;0.8286;0.8571;0.8857;0.9143;0.9429;0.9714;1.0000" dur="2.4s" begin="1.1s" calcMode="discrete"/>
      <set attributeName="x" to="641.0" begin="3.5s" fill="freeze"/>
      <set attributeName="x" to="262.0" begin="0s" dur="1.1s"/>
