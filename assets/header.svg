    <text x="450" y="200" text-anchor="middle" class="mono pop" font-size="9.5" letter-spacing="3" fill="#6b7590" style="animation-delay:3.4s">NEW DELHI</text>
    <g class="mono" font-size="9" letter-spacing="2.5" fill="#6b7590">
      <text x="24" y="28">TANISHKAJ26</text>
      <text x="862" y="28" text-anchor="end">OPEN TO SUMMER INTERNSHIPS</text>
    </g>
    <circle cx="874" cy="25" r="3.2" fill="#8ff0d6" class="beacon" style="animation-delay:0.0s"/>
    <circle cx="874" cy="25" r="3.2" fill="#8ff0d6"/>
    <rect x=".5" y=".5" width="899" height="229" rx="14" fill="none" stroke="#232b40"/>
  </g>
</svg>
