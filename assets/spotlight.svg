<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 232" width="440" height="232" role="img" aria-labelledby="t d">
  <title id="t">Spotlight</title>
  <desc id="d">Spotlight. AI webinar SaaS. Hosts stream live from OBS, with VAPI voice agents users configure themselves. Recordings and Stripe subscriptions. Built with Next.js 15, TypeScript, Prisma, Neon Postgres.</desc>
  <defs>
    <radialGradient id="sky" cx="38%" cy="40%" r="85%">
      <stop offset="0" stop-color="#141c33"/><stop offset=".55" stop-color="#0a0f1e"/><stop offset="1" stop-color="#04060c"/>
    </radialGradient>
    <radialGradient id="neb-blue"><stop offset="0" stop-color="#3b5bdb" stop-opacity=".24"/><stop offset="1" stop-color="#3b5bdb" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb-rose"><stop offset="0" stop-color="#b8487a" stop-opacity=".18"/><stop offset="1" stop-color="#b8487a" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb-amber"><stop offset="0" stop-color="#c9822f" stop-opacity=".2"/><stop offset="1" stop-color="#c9822f" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb-teal"><stop offset="0" stop-color="#1f9c84" stop-opacity=".2"/><stop offset="1" stop-color="#1f9c84" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-blue"><stop offset="0" stop-color="#bcd6ff" stop-opacity=".55"/><stop offset=".35" stop-color="#6f9eff" stop-opacity=".18"/><stop offset="1" stop-color="#6f9eff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-amber"><stop offset="0" stop-color="#ffe2b0" stop-opacity=".55"/><stop offset=".4" stop-color="#ffb04a" stop-opacity=".14"/><stop offset="1" stop-color="#ffb04a" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-teal"><stop offset="0" stop-color="#c4fff0" stop-opacity=".55"/><stop offset=".4" stop-color="#3fd9b0" stop-opacity=".14"/><stop offset="1" stop-color="#3fd9b0" stop-opacity="0"/></radialGradient>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="frame"><rect width="440" height="232" rx="16"/></clipPath>
  </defs>
  <style>
    .pop { animation: pop .9s ease-out both; }
    .rise { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
    .cl { fill: none; stroke: #8fa9dc; stroke-width: 1; stroke-opacity: .55; stroke-dasharray: 1; animation: draw 1.1s ease-out both; }
    .tw { animation: twinkle 4s ease-in-out infinite; }
    .tw2 { animation-duration: 5.5s; }
    .tw3 { animation-duration: 7s; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 5s ease-in-out infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 30s linear infinite; }
    .beacon { transform-box: fill-box; transform-origin: center; animation: beacon 2.4s ease-out infinite; }
    .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: .9; } 50% { opacity: .15; } }
    @keyframes pulse { 0%, 100% { transform: scale(.88); opacity: .8; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes beacon { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="440" height="232" fill="url(#sky)"/>

    <circle cx="40" cy="40" r="220" fill="url(#neb-amber)"/>
    <g><circle cx="36.5" cy="207.9" r="0.8" fill="#cfe0ff" opacity="0.59"/><circle cx="430.9" cy="8.7" r="1.2" fill="#ffffff" opacity="0.59" class="tw tw2" style="animation-delay:3.7s"/><circle cx="66.3" cy="220.7" r="1.2" fill="#ffffff" opacity="0.38"/><circle cx="432.8" cy="44.0" r="1.0" fill="#ffffff" opacity="0.21"/><circle cx="299.2" cy="6.9" r="0.4" fill="#ffffff" opacity="0.42" class="tw tw3" style="animation-delay:5.1s"/><circle cx="83.3" cy="217.0" r="0.6" fill="#ffffff" opacity="0.65" class="tw tw1" style="animation-delay:5.9s"/><circle cx="427.6" cy="15.3" r="0.4" fill="#ffffff" opacity="0.71" class="tw tw2" style="animation-delay:3.6s"/><circle cx="426.4" cy="183.0" r="1.0" fill="#ffffff" opacity="0.32"/><circle cx="427.5" cy="103.6" r="0.6" fill="#ffffff" opacity="0.58"/><circle cx="87.7" cy="7.9" r="0.5" fill="#ffffff" opacity="0.51"/><circle cx="369.7" cy="211.6" r="1.0" fill="#dcd4ff" opacity="0.4"/><circle cx="430.4" cy="19.9" r="0.6" fill="#ffe9c9" opacity="0.42"/><circle cx="427.1" cy="55.0" r="0.6" fill="#ffffff" opacity="0.26"/><circle cx="185.8" cy="12.3" r="0.5" fill="#ffe9c9" opacity="0.27"/><circle cx="432.0" cy="210.7" r="0.6" fill="#ffffff" opacity="0.52"/><circle cx="329.0" cy="218.5" r="0.4" fill="#ffffff" opacity="0.25"/><circle cx="190.5" cy="222.6" r="0.7" fill="#cfe0ff" opacity="0.71"/><circle cx="223.9" cy="211.8" r="0.6" fill="#ffffff" opacity="0.65"/><circle cx="12.3" cy="194.0" r="1.0" fill="#ffffff" opacity="0.59"/><circle cx="214.6" cy="216.5" r="0.6" fill="#ffe9c9" opacity="0.6"/><circle cx="243.5" cy="6.4" r="0.6" fill="#ffe9c9" opacity="0.21" class="tw tw1" style="animation-delay:4.7s"/><circle cx="314.8" cy="219.7" r="0.7" fill="#ffffff" opacity="0.72"/><circle cx="10.1" cy="115.7" r="0.8" fill="#ffe9c9" opacity="0.46" class="tw tw3" style="animation-delay:5.5s"/><circle cx="425.9" cy="210.0" r="0.8" fill="#ffffff" opacity="0.51"/><circle cx="428.4" cy="27.0" r="0.6" fill="#ffffff" opacity="0.64"/><circle cx="246.6" cy="210.6" r="0.5" fill="#ffffff" opacity="0.45" class="tw tw2" style="animation-delay:3.8s"/><circle cx="217.1" cy="208.3" r="1.0" fill="#ffffff" opacity="0.68"/><circle cx="372.2" cy="215.8" r="0.7" fill="#ffffff" opacity="0.33"/><circle cx="408.9" cy="208.6" r="0.5" fill="#ffffff" opacity="0.71"/><circle cx="74.2" cy="223.6" r="0.4" fill="#ffffff" opacity="0.34"/><circle cx="195.7" cy="217.7" r="0.4" fill="#ffffff" opacity="0.49"/><circle cx="286.1" cy="217.1" r="0.4" fill="#dcd4ff" opacity="0.66"/><circle cx="249.1" cy="9.4" r="0.6" fill="#ffffff" opacity="0.6"/><circle cx="232.4" cy="209.8" r="0.5" fill="#ffffff" opacity="0.4" class="tw tw1" style="animation-delay:0.5s"/><circle cx="127.9" cy="213.2" r="1.2" fill="#ffffff" opacity="0.23"/><circle cx="30.5" cy="8.1" r="0.6" fill="#ffffff" opacity="0.34" class="tw tw1" style="animation-delay:3.0s"/><circle cx="430.0" cy="166.4" r="1.0" fill="#ffffff" opacity="0.64"/><circle cx="147.3" cy="8.2" r="0.7" fill="#ffffff" opacity="0.78"/><circle cx="138.5" cy="216.1" r="0.5" fill="#ffffff" opacity="0.7"/><circle cx="338.7" cy="207.2" r="0.5" fill="#dcd4ff" opacity="0.42"/><circle cx="68.9" cy="8.8" r="0.8" fill="#ffffff" opacity="0.38"/><circle cx="307.4" cy="6.4" r="0.4" fill="#cfe0ff" opacity="0.3"/><circle cx="178.1" cy="9.8" r="0.4" fill="#ffffff" opacity="0.55"/><circle cx="210.9" cy="213.1" r="0.4" fill="#cfe0ff" opacity="0.74"/><circle cx="429.4" cy="82.8" r="0.5" fill="#dcd4ff" opacity="0.74"/><circle cx="428.1" cy="33.3" r="0.4" fill="#ffffff" opacity="0.42" class="tw tw2" style="animation-delay:5.0s"/><circle cx="12.0" cy="30.5" r="0.6" fill="#ffe9c9" opacity="0.34"/><circle cx="8.6" cy="211.9" r="0.4" fill="#cfe0ff" opacity="0.55"/><circle cx="266.1" cy="219.6" r="0.4" fill="#ffffff" opacity="0.67" class="tw tw1" style="animation-delay:1.8s"/><circle cx="51.1" cy="225.8" r="0.6" fill="#ffffff" opacity="0.21" class="tw tw2" style="animation-delay:4.7s"/><circle cx="329.2" cy="224.8" r="0.4" fill="#ffffff" opacity="0.52"/><circle cx="417.7" cy="206.1" r="0.7" fill="#ffffff" opacity="0.29"/><circle cx="108.8" cy="224.7" r="0.4" fill="#dcd4ff" opacity="0.24"/><circle cx="7.6" cy="202.0" r="0.4" fill="#ffffff" opacity="0.68" class="tw tw3" style="animation-delay:4.1s"/><circle cx="114.4" cy="6.0" r="0.7" fill="#ffffff" opacity="0.76"/></g>
    <g class="pop" style="animation-delay:0.10s">
      <circle cx="44" cy="50" r="30" fill="url(#glow-amber)" class="pulse"/>
      <circle cx="44" cy="50" r="6.8" fill="#ffd28a" opacity=".35"/>
      <circle cx="44" cy="50" r="3.4" fill="#fff"/>
    </g>
    <circle cx="44" cy="50" r="15" fill="none" stroke="#ffd28a" stroke-width=".8" stroke-dasharray="2 4" opacity=".6" class="spin"/>
    <text x="72" y="59" class="sans rise" font-size="24" font-weight="800" fill="#f1f5ff" style="animation-delay:.2s">Spotlight</text>
    <text x="398" y="47" text-anchor="end" class="mono" font-size="9" letter-spacing="3" fill="#6f7fa6">LIVE</text>
    <circle cx="410" cy="44" r="3.2" fill="#ffd28a" class="beacon" style="animation-delay:0.6s"/>
    <circle cx="410" cy="44" r="3.2" fill="#ffd28a"/>
    <g class="sans rise" font-size="13.5" fill="#c3cde6" style="animation-delay:.4s"><text x="28" y="100">AI webinar SaaS. Hosts stream live from OBS,</text><text x="28" y="121">with VAPI voice agents users configure</text><text x="28" y="142">themselves. Recordings and Stripe subscriptions.</text></g>
    <g class="pop" style="animation-delay:0.70s">
      <rect x="28" y="164" width="84.0" height="22" rx="11" fill="#ffd28a" fill-opacity=".08" stroke="#ffd28a" stroke-opacity=".35"/>
      <text x="70.0" y="179" text-anchor="middle" class="mono" font-size="10" fill="#c3cde6">Next.js 15</text>
    </g><g class="pop" style="animation-delay:0.80s">
      <rect x="120.0" y="164" width="84.0" height="22" rx="11" fill="#ffd28a" fill-opacity=".08" stroke="#ffd28a" stroke-opacity=".35"/>
      <text x="162.0" y="179" text-anchor="middle" class="mono" font-size="10" fill="#c3cde6">TypeScript</text>
    </g><g class="pop" style="animation-delay:0.90s">
      <rect x="212.0" y="164" width="58.4" height="22" rx="11" fill="#ffd28a" fill-opacity=".08" stroke="#ffd28a" stroke-opacity=".35"/>
      <text x="241.2" y="179" text-anchor="middle" class="mono" font-size="10" fill="#c3cde6">Prisma</text>
