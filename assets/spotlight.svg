<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="440" height="224" role="img" aria-labelledby="t d">
  <title id="t">Spotlight</title>
  <desc id="d">Spotlight. AI webinar SaaS. Hosts stream live from OBS, with VAPI voice agents users configure themselves. Recordings and Stripe subscriptions. Built with Next.js 15, TypeScript, Prisma, Neon Postgres.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#111626"/><stop offset="1" stop-color="#0b0e18"/></linearGradient>
    <linearGradient id="glint" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="440" height="224" rx="14"/></clipPath>
  </defs>
  <style>
    .pop { animation: pop .9s ease-out both; }
    .rise { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.3s cubic-bezier(.2,.7,.2,1) both; }
    .beacon { transform-box: fill-box; transform-origin: center; animation: beacon 2.4s ease-out infinite; }
    .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes beacon { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }

    .chip { animation: chip 8s ease-in-out infinite; }
    @keyframes chip { 0%, 16%, 100% { stroke: #232b40; } 7% { stroke: #ffd28a; } }
    .comet { animation: comet 9.0s linear infinite; }
    .comet-tail { animation: comet-tail 9.0s linear infinite; }
    @keyframes comet { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1304; } }
    @keyframes comet-tail { from { stroke-dashoffset: 70; } to { stroke-dashoffset: -1234; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .comet, .comet-tail { display: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="440" height="224" fill="url(#surface)"/>

    <rect x="0" y="0" width="440" height="3" fill="#ffd28a" class="grow"/>
    <clipPath id="g"><rect x="0" y="0" width="440" height="3" rx="1.5"/></clipPath>
    <g clip-path="url(#g)"><rect x="-110" y="0" width="110" height="3" fill="url(#glint)" opacity=".8">
      <animateTransform attributeName="transform" type="translate" values="0 0;550 0;550 0" keyTimes="0;0.267;1" dur="6s" begin="1.4s" repeatCount="indefinite"/>
    </rect></g>
    <text x="28" y="54" class="sans rise" font-size="24" font-weight="800" fill="#f1f5ff" style="animation-delay:.15s">Spotlight</text>
    <text x="398" y="47" text-anchor="end" class="mono" font-size="9" letter-spacing="3" fill="#6b7590">LIVE</text>
    <circle cx="410" cy="44" r="3.2" fill="#ffd28a" class="beacon" style="animation-delay:0.6s"/>
    <circle cx="410" cy="44" r="3.2" fill="#ffd28a"/>
    <g class="sans rise" font-size="13.5" fill="#b8c2d9" style="animation-delay:.35s"><text x="28" y="92">AI webinar SaaS. Hosts stream live from OBS,</text><text x="28" y="113">with VAPI voice agents users configure</text><text x="28" y="134">themselves. Recordings and Stripe subscriptions.</text></g>
    <g class="pop" style="animation-delay:0.60s">
      <rect x="28" y="156" width="84.0" height="22" rx="11" fill="none" stroke="#232b40" stroke-width="1.2" class="chip" style="animation-delay:1.50s"/>
      <text x="70.0" y="171" text-anchor="middle" class="mono" font-size="10" fill="#b8c2d9">Next.js 15</text>
    </g><g class="pop" style="animation-delay:0.70s">
      <rect x="120.0" y="156" width="84.0" height="22" rx="11" fill="none" stroke="#232b40" stroke-width="1.2" class="chip" style="animation-delay:1.95s"/>
      <text x="162.0" y="171" text-anchor="middle" class="mono" font-size="10" fill="#b8c2d9">TypeScript</text>
    </g><g class="pop" style="animation-delay:0.80s">
      <rect x="212.0" y="156" width="58.4" height="22" rx="11" fill="none" stroke="#232b40" stroke-width="1.2" class="chip" style="animation-delay:2.40s"/>
      <text x="241.2" y="171" text-anchor="middle" class="mono" font-size="10" fill="#b8c2d9">Prisma</text>
    </g><g class="pop" style="animation-delay:0.90s">
      <rect x="278.4" y="156" width="103.2" height="22" rx="11" fill="none" stroke="#232b40" stroke-width="1.2" class="chip" style="animation-delay:2.85s"/>
      <text x="330.0" y="171" text-anchor="middle" class="mono" font-size="10" fill="#b8c2d9">Neon Postgres</text>
    </g>
    <text x="28" y="206" class="mono" font-size="9" letter-spacing="1" fill="#6b7590">github.com/TanishkaJ26/Spotlight</text>
    <text x="412" y="206" text-anchor="end" class="mono" font-size="9" letter-spacing="2" fill="#ffd28a">REPO ↗</text>
    <rect x=".5" y=".5" width="439" height="223" rx="14" fill="none" stroke="#232b40"/>
    <path d="M14.5 0.5H425.5A14 14 0 0 1 439.5 14.5V209.5A14 14 0 0 1 425.5 223.5H14.5A14 14 0 0 1 0.5 209.5V14.5A14 14 0 0 1 14.5 0.5Z" fill="none" stroke="#ffd28a" stroke-width="3" stroke-opacity=".2" stroke-dasharray="110 1194" class="comet-tail"/>
    <path d="M14.5 0.5H425.5A14 14 0 0 1 439.5 14.5V209.5A14 14 0 0 1 425.5 223.5H14.5A14 14 0 0 1 0.5 209.5V14.5A14 14 0 0 1 14.5 0.5Z" fill="none" stroke="#ffd28a" stroke-width="1.5" stroke-dasharray="36 1268" stroke-linecap="round" class="comet"/>
  </g>
</svg>
