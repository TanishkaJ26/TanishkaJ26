    <circle cx="410" cy="44" r="3.2" fill="#8ff0d6"/>
    <g class="sans rise" font-size="13.5" fill="#c3cde6" style="animation-delay:.4s"><text x="28" y="100">Airbnb-inspired rentals. List, edit and browse</text><text x="28" y="121">properties with auth, Mapbox geocoding,</text><text x="28" y="142">search, category filters, Cloudinary uploads.</text></g>
