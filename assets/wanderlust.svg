<circle cx="396.2" cy="222.8" r="0.7" fill="#ffffff" opacity="0.68"/><circle cx="197.2" cy="11.7" r="1.0" fill="#ffffff" opacity="0.49" class="tw tw1" style="animation-delay:1.1s"/><circle cx="241.6" cy="6.0" r="0.4" fill="#ffffff" opacity="0.52" class="tw tw3" style="animation-delay:4.4s"/><circle cx="383.1" cy="206.7" r="0.6" fill="#ffffff" opacity="0.69" class="tw tw3" style="animation-delay:3.5s"/><circle cx="263.1" cy="206.0" r="0.7" fill="#ffffff" opacity="0.28"/><circle cx="7.2" cy="200.1" r="1.2" fill="#cfe0ff" opacity="0.59"/></g>
    <g class="pop" style="animation-delay:0.10s">
      <circle cx="44" cy="50" r="30" fill="url(#glow-teal)" class="pulse"/>
      <circle cx="44" cy="50" r="6.8" fill="#8ff0d6" opacity=".35"/>
      <circle cx="44" cy="50" r="3.4" fill="#fff"/>
