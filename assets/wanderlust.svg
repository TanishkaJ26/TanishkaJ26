<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 224" width="440" height="224" role="img" aria-labelledby="t d">
  <title id="t">WanderLust</title>
  <desc id="d">WanderLust. Airbnb-inspired rentals. List, edit and browse properties with auth, Mapbox geocoding, search, category filters, Cloudinary uploads. Built with Node.js, Express, MongoDB Atlas, Passport.js.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#111626"/><stop offset="1" stop-color="#0b0e18"/></linearGradient>
    <clipPath id="frame"><rect width="440" height="224" rx="14"/></clipPath>
  </defs>
  <style>
    .pop { animation: pop .9s ease-out both; }
    .rise { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.3s cubic-bezier(.2,.7,.2,1) both; }
    .beacon { transform-box: fill-box; transform-origin: center; animation: beacon 2.4s ease-out infinite; }
    .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes beacon { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="440" height="224" fill="url(#surface)"/>

    <rect x="0" y="0" width="440" height="3" fill="#8ff0d6" class="grow"/>
    <text x="28" y="54" class="sans rise" font-size="24" font-weight="800" fill="#f1f5ff" style="animation-delay:.15s">WanderLust</text>
    <text x="398" y="47" text-anchor="end" class="mono" font-size="9" letter-spacing="3" fill="#6b7590">LIVE</text>
    <circle cx="410" cy="44" r="3.2" fill="#8ff0d6" class="beacon" style="animation-delay:0.6s"/>
    <circle cx="410" cy="44" r="3.2" fill="#8ff0d6"/>
    <g class="sans rise" font-size="13.5" fill="#b8c2d9" style="animation-delay:.35s"><text x="28" y="92">Airbnb-inspired rentals. List, edit and browse</text><text x="28" y="113">properties with auth, Mapbox geocoding,</text><text x="28" y="134">search, category filters, Cloudinary uploads.</text></g>
    <g class="pop" style="animation-delay:0.60s">
      <rect x="28" y="156" width="64.8" height="22" rx="11" fill="none" stroke="#232b40" stroke-width="1.2"/>
      <text x="60.4" y="171" text-anchor="middle" class="mono" font-size="10" fill="#b8c2d9">Node.js</text>
    </g><g class="pop" style="animation-delay:0.70s">
      <rect x="100.80000000000001" y="156" width="64.8" height="22" rx="11" fill="none" stroke="#232b40" stroke-width="1.2"/>
      <text x="133.2" y="171" text-anchor="middle" class="mono" font-size="10" fill="#b8c2d9">Express</text>
    </g><g class="pop" style="animation-delay:0.80s">
      <rect x="173.60000000000002" y="156" width="103.2" height="22" rx="11" fill="none" stroke="#232b40" stroke-width="1.2"/>
      <text x="225.2" y="171" text-anchor="middle" class="mono" font-size="10" fill="#b8c2d9">MongoDB Atlas</text>
    </g><g class="pop" style="animation-delay:0.90s">
      <rect x="284.8" y="156" width="90.4" height="22" rx="11" fill="none" stroke="#232b40" stroke-width="1.2"/>
      <text x="330.0" y="171" text-anchor="middle" class="mono" font-size="10" fill="#b8c2d9">Passport.js</text>
    </g>
    <text x="28" y="206" class="mono" font-size="9" letter-spacing="1" fill="#6b7590">github.com/TanishkaJ26/wanderlust</text>
    <text x="412" y="206" text-anchor="end" class="mono" font-size="9" letter-spacing="2" fill="#8ff0d6">REPO ↗</text>
    <rect x=".5" y=".5" width="439" height="223" rx="14" fill="none" stroke="#232b40"/>
  </g>
</svg>
