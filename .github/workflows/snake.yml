name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *" # regenerates every 12h (UTC)
  workflow_dispatch: # manual "Run workflow" button
  push:
    branches: [main] # regenerates whenever README changes

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs from contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#00E5A0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00E5A0&color_dots=#161B22,#0B3D2E,#00805A,#00B37D,#00E5A0

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
